[project]
name = "ndat"
version = "0.1.0"
description = "An NFLverse-based analysis workspace with a canonical local data layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "nflreadpy>=0.1.5",
    "polars>=1.44.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
